## Gradle 自身
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## 环境
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.238
neo_version_range=[21,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod 属性（注意：.properties 按 ISO-8859-1 读取，这里只用 ASCII）
mod_id=keybindlayers
mod_name=Keybind Layers
mod_license=MIT
mod_version=1.0.0
mod_group_id=caibai_fish.keybindlayers
mod_authors=CaiBai-fish
mod_description=Layer-aware keybind conflict check. Two keybinds only show up as conflicting when they belong to the same action layer, so the same key used in different contexts (gameplay vs. GUI vs. mod-specific layers) is no longer flagged in the Controls screen.
